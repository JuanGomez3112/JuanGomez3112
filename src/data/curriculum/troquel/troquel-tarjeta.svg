<?xml version="1.0" encoding="UTF-8"?>
<!--
  TROQUEL para la tarjeta alojada en el CV.
  Panel A4 apaisado 297x210 mm. Tarjeta 85x55 mm.
  Tarjeta en x=30 y=140 mm desde la esquina superior izquierda.
  Cortes de 24 mm a 45 grados, centrados en cada esquina.

  Va en el cuadrante inferior izquierdo porque es la unica zona libre: el
  centro choca con la maqueta del navegador y con el bloque del QR.

  En Illustrator: capa APARTE llamada TROQUEL, tinta plana en sobreimpresion.
  El punteado es guia y no se imprime.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
  <g id="guia" stroke="#8a8a8a" stroke-width="0.25" stroke-dasharray="2 2" fill="none">
    <rect x="3.0" y="3.0" width="291.0" height="204.0"/>
    <rect x="30.0" y="140.0" width="85.0" height="55.0" stroke="#c9a24b"/>
  </g>
  <g id="TROQUEL" stroke="#ff00ff" stroke-width="0.35" fill="none" stroke-linecap="round">
    <line x1="21.51" y1="131.51" x2="38.49" y2="148.49"/>
    <line x1="123.49" y1="131.51" x2="106.51" y2="148.49"/>
    <line x1="21.51" y1="203.49" x2="38.49" y2="186.51"/>
    <line x1="123.49" y1="203.49" x2="106.51" y2="186.51"/>
  </g>
</svg>
