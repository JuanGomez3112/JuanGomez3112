<?xml version="1.0" encoding="UTF-8"?>
<!--
  TROQUEL para la tarjeta alojada en el CV.
  Panel A4 apaisado 297x210 mm.

  Tarjeta: 95.2 x 57.1 mm  (medida del PDF con sangrado).
  Posicion: x=30.9 y=76.2 mm, centrada en el mismo punto que la ventana
  dibujada en el arte.

  IMPORTANTE: los cortes van en las esquinas de la TARJETA REAL, no en las del
  rectangulo impreso. Si la tarjeta es mas grande que ese rectangulo, lo tapa
  entero y deja de verse, que es incluso mejor. Medir la tarjeta ya impresa con
  regla y regenerar con ese numero.

  Espacio libre comprobado en el arte: el monograma acaba hacia y=60 mm, el
  titulo "Mi Tarjeta" empieza hacia y=145, y el QR hacia x=187. Cabe una
  tarjeta bastante mayor sin tocar nada mas.

  En Illustrator: capa APARTE llamada TROQUEL, tinta plana en sobreimpresion.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
  <g id="guia" stroke="#8a8a8a" stroke-width="0.25" stroke-dasharray="2 2" fill="none">
    <rect x="3.0" y="3.0" width="291.0" height="204.0"/>
    <rect x="30.90" y="76.25" width="95.2" height="57.1" stroke="#c9a24b"/>
  </g>
  <g id="TROQUEL" stroke="#ff00ff" stroke-width="0.35" fill="none" stroke-linecap="round">
    <line x1="21.71" y1="67.06" x2="40.09" y2="85.44"/>
    <line x1="135.29" y1="67.06" x2="116.91" y2="85.44"/>
    <line x1="21.71" y1="142.54" x2="40.09" y2="124.16"/>
    <line x1="135.29" y1="142.54" x2="116.91" y2="124.16"/>
  </g>
</svg>
