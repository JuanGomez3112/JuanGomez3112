<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
  :root{ --px:4; }            /* 4 px por mm */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0d0e;display:flex;align-items:center;justify-content:center;
       min-height:100vh;font-family:"Louis George Cafe","Segoe UI",sans-serif}
  .escena{perspective:2600px;perspective-origin:50% 45%;padding:70px}
  /* panel = contraportada A4 apaisada, 297x210 mm */
  .panel{position:relative;width:1188px;height:840px;transform-style:preserve-3d;
         transform:rotateX(34deg) rotateZ(-16deg);
         box-shadow:0 60px 90px rgba(0,0,0,.75)}
  .panel > img{width:100%;height:100%;display:block}

  /* cortes del troquel: 24 mm a 45 grados en cada esquina de la tarjeta */
  .corte{position:absolute;width:96px;height:2px;background:rgba(0,0,0,.85);
         box-shadow:0 1px 0 rgba(255,255,255,.10);transform-origin:center}
  /* tarjeta 85x55 mm en x=30 y=140 mm  ->  340x220 px en 120,560 */
  .tarjeta{position:absolute;left:120px;top:560px;width:340px;height:220px;
           border-radius:5px;overflow:hidden;transform:translateZ(5px);
           background:linear-gradient(150deg,#262626 0%,#0c0c0c 78%);
           box-shadow:0 16px 26px rgba(0,0,0,.65)}
  .barra{position:absolute;inset:0 0 auto 0;height:30px;background:#151515;
         border-bottom:1px solid #262626;display:flex;align-items:center;gap:6px;padding:0 11px}
  .punto{width:7px;height:7px;border-radius:50%;background:#3a3a3a}
  .punto.on{background:#C9A24B}
  .url{flex:1;height:15px;border-radius:8px;background:#1e1e1e;display:flex;
       align-items:center;justify-content:center;font-size:9px;color:#7d7d7d}
  .cuerpo{position:absolute;left:26px;right:26px;top:62px}
  .hola{font-family:"Minion Pro",Georgia,serif;font-style:italic;font-size:14px;color:#8a8a8a}
  .nombre{font-size:37px;line-height:1.05;color:#fff;margin-top:2px}
  .nombre .n1{font-family:"Minion Pro",Georgia,serif}
  .nombre .n2{font-family:"Berlin Sans FB Demi","Berlin Sans FB",sans-serif;font-weight:700}
  .rol{margin-top:10px;font-size:10.5px;letter-spacing:3.6px;text-transform:uppercase;color:#C9A24B}
  .hair{height:1px;width:76px;margin-top:13px;background:linear-gradient(90deg,#C9A24B,transparent)}
  .diag{position:absolute;right:-40px;bottom:-70px;width:190px;height:150px;
        background:linear-gradient(135deg,rgba(201,162,75,0) 40%,rgba(201,162,75,.55) 100%);
        transform:rotate(-18deg)}
  /* esquinas del papel por ENCIMA de la tarjeta: es lo que la sujeta */
  .solapa{position:absolute;width:0;height:0;transform:translateZ(6px)}
</style></head><body>
<div class="escena">
  <div class="panel">
    <img src="http://127.0.0.1:8777/src/assets/img/curriculum/cv-cara6-contraportada.webp" alt="">

    <div class="tarjeta">
      <div class="barra"><i class="punto"></i><i class="punto"></i><i class="punto on"></i>
        <span class="url">juangomez3112.github.io/JuanGomez3112</span></div>
      <div class="cuerpo">
        <p class="hola">Hola! soy</p>
        <p class="nombre"><span class="n1">Juan</span> <span class="n2">Gómez</span></p>
        <p class="rol">Técnico de TI</p>
        <div class="hair"></div>
      </div>
      <div class="diag"></div>
    </div>

    <!-- las 4 solapas de papel que muerden las esquinas -->
    <div class="solapa" style="left:120px;top:560px;border-left:52px solid #1c1c1e;border-bottom:52px solid transparent"></div>
    <div class="solapa" style="left:408px;top:560px;border-right:52px solid #1c1c1e;border-bottom:52px solid transparent"></div>
    <div class="solapa" style="left:120px;top:728px;border-left:52px solid #1c1c1e;border-top:52px solid transparent"></div>
    <div class="solapa" style="left:408px;top:728px;border-right:52px solid #1c1c1e;border-top:52px solid transparent"></div>

    <!-- lineas de corte -->
    <div class="corte" style="left:72px;top:560px;transform:rotate(45deg)"></div>
    <div class="corte" style="left:412px;top:560px;transform:rotate(-45deg)"></div>
    <div class="corte" style="left:72px;top:780px;transform:rotate(-45deg)"></div>
    <div class="corte" style="left:412px;top:780px;transform:rotate(45deg)"></div>
  </div>
</div></body></html>
